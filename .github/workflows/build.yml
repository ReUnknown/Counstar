# Builds Counstar on GitHub's machines (they have the Android SDK; Gradle fetches the platform it needs).
#
# - Any branch push: a debug build, to check the code compiles.
# - A version tag (v0.5.6): a release APK signed with Counstar's key, attached to a GitHub
#   release. The key comes from two encrypted repository secrets and is never in the repo:
#     KEYSTORE_BASE64      the .jks file, base64-encoded
#     KEYSTORE_PROPERTIES  keystore/keystore.properties, as is
#   Release notes come from .github/release-notes/<tag>.md when that file exists.
#   Without those secrets, a tag builds the release APK unsigned and uploads it (with
#   apksigner and zipalign) as the "unsigned-release" artifact, to be signed elsewhere.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PROPERTIES != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build (debug)
        if: env.RELEASE != 'true'
        run: ./gradlew assembleDebug

      - name: Check the tag matches the app's version
        if: env.RELEASE == 'true'
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore the signing key
        if: env.RELEASE == 'true' && env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/counstar-release.jks
          printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore/keystore.properties

      - name: Build the signed APK
        if: env.RELEASE == 'true'
        run: ./gradlew assembleRelease

      - name: Upload the unsigned APK and signing tools
        if: env.RELEASE == 'true' && env.HAS_KEY != 'true'
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p unsigned/lib64
          cp app/build/outputs/apk/release/app-release-unsigned.apk "unsigned/Counstar-$VERSION-unsigned.apk"
          cp "$tools/lib/apksigner.jar" "$tools/zipalign" unsigned/
          cp -r "$tools/lib64/." unsigned/lib64/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true' && env.HAS_KEY != 'true'
        with:
          name: unsigned-release
          path: unsigned/
          retention-days: 3

      - name: Check the signature
        if: env.RELEASE == 'true' && env.HAS_KEY == 'true'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$tools/apksigner" verify "$apk"
          mkdir -p dist
          cp "$apk" "dist/Counstar-$VERSION.apk"
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] && echo "NOTES=$notes" >> "$GITHUB_ENV" || true

      - name: Publish the release
        if: env.RELEASE == 'true' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Counstar ${{ env.VERSION }}
          body_path: ${{ env.NOTES }}
          generate_release_notes: ${{ env.NOTES == '' }}
          files: dist/Counstar-${{ env.VERSION }}.apk

      - name: Clean up the key
        if: always()
        run: rm -rf keystore
