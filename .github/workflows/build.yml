# Builds Counstar on GitHub's machines (they have the Android SDK; Gradle fetches the platform it needs).
#
# - Any branch push: a debug build, to check the code compiles.
# - A version tag (v0.5.6), or running it by hand with "release" ticked: a release APK signed with Counstar's key, attached to a GitHub
#   release. The key comes from two encrypted repository secrets and is never in the repo:
#     KEYSTORE_BASE64      the .jks file, base64-encoded
#     KEYSTORE_PROPERTIES  keystore/keystore.properties, as is
#   Release notes come from .github/release-notes/<tag>.md when that file exists.
#   Without those secrets, the release APK is built unsigned and put (with apksigner and
#   zipalign) on a draft release, to be signed elsewhere, swapped in, and published from there.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Build the release (tagged v<versionName>)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PROPERTIES != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build (debug)
        if: env.RELEASE != 'true'
        run: ./gradlew assembleDebug

      - name: Check the tag matches the app's version
        if: env.RELEASE == 'true'
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Restore the signing key
        if: env.RELEASE == 'true' && env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/counstar-release.jks
          printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore/keystore.properties

      - name: Build the signed APK
        if: env.RELEASE == 'true'
        run: ./gradlew assembleRelease

      - name: Upload the unsigned APK and signing tools
        if: env.RELEASE == 'true' && env.HAS_KEY != 'true'
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p unsigned/lib64
          cp app/build/outputs/apk/release/app-release-unsigned.apk "unsigned/Counstar-$VERSION-unsigned.apk"
          cp "$tools/lib/apksigner.jar" "$tools/zipalign" unsigned/
          cp -r "$tools/lib64/." unsigned/lib64/ 2>/dev/null || true

      - name: Put them on a draft release
        if: env.RELEASE == 'true' && env.HAS_KEY != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Counstar ${{ env.VERSION }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            unsigned/*
            unsigned/lib64/*

      - name: Check the signature
        if: env.RELEASE == 'true' && env.HAS_KEY == 'true'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$tools/apksigner" verify "$apk"
          mkdir -p dist
          cp "$apk" "dist/Counstar-$VERSION.apk"
          notes=".github/release-notes/$TAG.md"
          [ -f "$notes" ] && echo "NOTES=$notes" >> "$GITHUB_ENV" || true

      - name: Remove a leftover draft of this release
        if: env.RELEASE == 'true' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

      - name: Publish the release
        if: env.RELEASE == 'true' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Counstar ${{ env.VERSION }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ env.NOTES }}
          generate_release_notes: ${{ env.NOTES == '' }}
          files: dist/Counstar-${{ env.VERSION }}.apk

      - name: Clean up the key
        if: always()
        run: rm -rf keystore
